name: Validate approved brand assets
on:
  pull_request:
    paths:
      - 'brand-registry/**'
      - 'standards/ABNEOS_BRAND_IDENTITY_STANDARD.md'
      - '.github/workflows/brand-assets.yml'
  push:
    branches: [main]
    paths:
      - 'brand-registry/**'
      - '.github/workflows/brand-assets.yml'
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node brand-registry/validate.mjs
      - run: node --test brand-registry/render.test.mjs
